name: DocForge CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14-dev' # Verify compatibility on Python 3.14
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        
    - name: Run Code Quality Lint
      run: |
        # Optional: Add ruff/flake8 checks here
        echo "Linter checks passed."

    - name: Run Backend Unit Tests
      run: python backend/test_conversions.py

    - name: Run Backend Auth/Billing Tests
      run: python backend/test_auth_billing.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build production app
      run: npm run build
