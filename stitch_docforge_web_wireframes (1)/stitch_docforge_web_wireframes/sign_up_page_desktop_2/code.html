<body class="min-h-screen flex items-center justify-center relative overflow-hidden py-10 px-margin-mobile md:px-margin-desktop">
<!-- Main Card Container -->
<main class="card-bg w-full max-w-[480px] rounded-2xl p-8 sm:p-10 relative z-10 flex flex-col gap-stack-lg">
<!-- Header -->
<header class="text-center flex flex-col items-center">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-surface-container border border-white/10 mb-6 shadow-inner">
<span class="material-symbols-outlined text-primary-container text-[28px]" style="font-variation-settings: 'FILL' 1;">document_scanner</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-2 tracking-tight">Create an account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join DocuAll for high-performance productivity.</p>
</header>
<!-- Sign Up Form -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="fullName">Full Name</label>
<div class="relative input-glow-focus rounded-lg transition-all duration-300">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none transition-colors">person</span>
<input class="w-full bg-surface-container-lowest border border-white/10 rounded-lg py-3.5 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-transparent transition-colors" id="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative input-glow-focus rounded-lg transition-all duration-300">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none transition-colors">mail</span>
<input class="w-full bg-surface-container-lowest border border-white/10 rounded-lg py-3.5 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-transparent transition-colors" id="email" placeholder="jane@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative input-glow-focus rounded-lg transition-all duration-300">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none transition-colors">lock</span>
<input class="w-full bg-surface-container-lowest border border-white/10 rounded-lg py-3.5 pl-12 pr-12 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-transparent transition-colors" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant/70 mt-1">Must be at least 8 characters.</p>
</div>
<!-- Primary Action -->
<button class="w-full mt-4 bg-primary-container text-on-primary-container font-label-md text-label-md py-3.5 px-6 rounded-lg flex items-center justify-center gap-2 hover:bg-primary transition-all duration-200 shadow-[inset_0_1px_0_rgba(255,255,255,0.2)] hover:shadow-[0_0_20px_rgba(0,217,72,0.3)] active:scale-[0.98]" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 before:h-[1px] before:flex-1 before:bg-white/10 after:h-[1px] after:flex-1 after:bg-white/10">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Or continue with</span>
</div>
<!-- Social Actions -->
<div class="flex flex-col gap-3">
<button class="w-full bg-transparent border border-white/10 hover:border-white/20 hover:bg-white/5 text-on-surface font-label-md text-label-md py-3 px-4 rounded-lg flex items-center justify-center gap-3 transition-all duration-200 active:scale-[0.98]">

<span>Sign up with Google</span>
</button>
<button class="w-full bg-transparent border border-white/10 hover:border-white/20 hover:bg-white/5 text-on-surface font-label-md text-label-md py-3 px-4 rounded-lg flex items-center justify-center gap-3 transition-all duration-200 active:scale-[0.98]">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M16.365 7.124c.792-1.025 1.328-2.454 1.184-3.876-1.182.05-2.666.837-3.486 1.862-.656.812-1.298 2.274-1.118 3.668 1.332.106 2.628-.625 3.42-1.654zm-4.148 10.638c-.287.97-.834 1.89-1.576 2.88-.636.852-1.428 1.95-2.584 1.95-1.116 0-1.528-.708-2.868-.708-1.33 0-1.782.684-2.846.708-1.156.024-2.02-1.176-2.656-2.074-1.252-1.776-2.204-4.524-2.204-6.84 0-3.324 1.954-4.884 3.754-4.884 1.114 0 2.146.756 2.844.756.72 0 1.954-.804 3.286-.804 1.378 0 2.508.576 3.216 1.62-2.736 1.584-2.28 5.628.372 6.648-.612 1.584-1.5 3.036-2.062 4.092-.852 1.608-1.186 2.508-1.996 2.508-1.092 0-1.404-.708-2.68-.708s-1.61.708-2.68.708c-.78 0-1.144-.9-1.996-2.508zM14.28 18.28c.36-.61.73-1.27 1.07-1.97.28-.58.55-1.18.79-1.79-1.37-.84-2.01-2.43-1.84-3.95.14-1.24.81-2.34 1.85-3.03-.68-.82-1.66-1.28-2.71-1.28-1.16 0-2.24.71-2.85.71-.62 0-1.7-.71-2.86-.71-1.48 0-2.86 1.05-3.55 2.37-1.35 2.55-1.31 5.91.07 8.36.43.76.95 1.5 1.55 2.17.65.73 1.37 1.48 2.27 1.48.86 0 1.25-.56 2.25-.56s1.39.56 2.25.56c.9 0 1.62-.75 2.27-1.48.54-.61 1.03-1.28 1.44-1.93z"></path>
</svg>
<span>Sign up with Apple</span>
</button>
</div>
<!-- Footer Link -->
<div class="text-center mt-2">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-primary hover:text-primary-fixed transition-colors font-label-md" href="#">Log In</a>
</p>
</div>
</main>
<!-- Interactive script for input focus states -->
<script>
        document.querySelectorAll('input').forEach(input => {
            const icon = input.parentElement.querySelector('.material-symbols-outlined');
            
            input.addEventListener('focus', () => {
                if(icon) icon.classList.add('text-primary');
            });
            
            input.addEventListener('blur', () => {
                if(icon) icon.classList.remove('text-primary');
            });
        });
    </script>
</body></html>
