version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      target: backend-runner
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      - redis
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/output:/app/backend/output

  worker:
    build:
      context: .
      target: backend-runner
    command: ["python", "backend/worker.py"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/output:/app/backend/output
